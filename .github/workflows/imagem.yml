# Monta a imagem da calculadora e publica no GitHub Container Registry (ghcr.io)
# a cada alteração na branch main. A VPS só baixa a imagem pronta, sem precisar
# compilar nada (economiza memória do servidor, que também roda o CRM).
name: Publicar imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
